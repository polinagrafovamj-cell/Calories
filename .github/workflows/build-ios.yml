name: Build iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # нужно для публикации релиза по тегу

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CalorieCounter.xcodeproj \
            -scheme CalorieCounter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CalorieCounter.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -R "$RUNNER_TEMP/CalorieCounter.xcarchive/Products/Applications/CalorieCounter.app" build/Payload/
          cd build && zip -qry CalorieCounter-unsigned.ipa Payload
          ls -lh CalorieCounter-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: CalorieCounter-unsigned-ipa
          path: build/CalorieCounter-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/CalorieCounter-unsigned.ipa
          generate_release_notes: true
