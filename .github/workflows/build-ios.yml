name: Build iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Веб-версия собирается отдельно (deploy-pwa.yml)
    paths-ignore: ["web/**", ".github/workflows/deploy-pwa.yml"]
  pull_request:
    paths-ignore: ["web/**", ".github/workflows/deploy-pwa.yml"]
  workflow_dispatch:

permissions:
  contents: write # нужно для публикации релиза по тегу

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CalorieCounter.xcodeproj \
            -scheme CalorieCounter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CalorieCounter.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Report compiler errors
        if: failure()
        run: |
          # Выводим ошибки как аннотации, чтобы их было видно на странице запуска
          grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -R "$RUNNER_TEMP/CalorieCounter.xcarchive/Products/Applications/CalorieCounter.app" build/Payload/
          cd build && zip -qry CalorieCounter.ipa Payload
          ls -lh CalorieCounter.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: CalorieCounter-unsigned-ipa
          path: build/CalorieCounter.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

      # Каждая сборка main (или запуск вручную) публикует релиз, поэтому последний файл
      # всегда доступен по ссылке .../releases/latest/download/CalorieCounter.ipa
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Сборка {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: build/CalorieCounter.ipa
          make_latest: true
          body: |
            Неподписанная сборка iOS-приложения «Калории».
            Установка на iPhone — через Sideloadly, см. README.
